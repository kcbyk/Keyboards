name: Build APK & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup local.properties with API Key
        env:
          MUSIC_API_KEY: ${{ secrets.MUSIC_API_KEY }}
        run: |
          if [ -z "$MUSIC_API_KEY" ]; then
            echo "Secret empty, using fallback key"
            MUSIC_API_KEY="sk-71c69f4de1f4b912957fed45"
          fi
          echo "MUSIC_API_KEY=${MUSIC_API_KEY}" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MusicKeyboard v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          body: |
            Otomatik build - Music Keyboard APK
            - Custom IME + Foreground Download Service
            - API: mp3-apisi.onrender.com
            - Build: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
